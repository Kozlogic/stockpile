[project]
name = "options-scanner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "lxml",
    "streamlit",
    "tabulate",
    "yfinance",
    "schwab-py",
]

[tool.poetry.dependencies]
stocks-shared = {path = "../shared", develop = true}

[dependency-groups]
dev = ["pytest>=8"]

[tool.poetry]
package-mode = false
